<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatbot jogos</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f2330;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --text-dim: #9aa0b4;
    --accent: #7c5cff;
    --accent-2: #5ad1c9;
    --user-bubble: #7c5cff;
    --bot-bubble: #1f2330;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
  }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 8px var(--accent-2);
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 82%;
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: rgba(255,107,107,0.1);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .sources {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .sources strong { color: var(--text-dim); }
  .sources ul { margin: 4px 0 0; padding-left: 18px; }
  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    max-height: 120px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  button#send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }
  button#send:hover:not(:disabled) { opacity: 0.9; }

  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span class="dot"></span> Chatbot jogos</h1>
      <p>Assistente especialista em jogos, pergunte o que tem dúvida e aprenda com a resposta!</p>
    </header>

    <div id="messages"></div>

    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Pergunte algo sobre jogos eletrônicos..." required></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // Histórico mantido no navegador (front-end) e enviado a cada requisição,
  // já que o back-end é stateless (função serverless).
  let history = [];

  function addMessage(role, text, sources) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;

    if (sources && sources.length) {
      const box = document.createElement('div');
      box.className = 'sources';
      const strong = document.createElement('strong');
      strong.textContent = 'Fontes consultadas:';
      box.appendChild(strong);
      const ul = document.createElement('ul');
      sources.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s.title + (s.source ? ` — ${s.source}` : '');
        ul.appendChild(li);
      });
      box.appendChild(ul);
      div.appendChild(box);
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage(text) {
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    addTyping();
    sendBtn.disabled = true;

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      });

      removeTyping();

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        addMessage('error', err.detail || `Erro ${resp.status} ao consultar o servidor.`);
        return;
      }

      const data = await resp.json();
      addMessage('bot', data.answer, data.sources);
      history.push({ role: 'assistant', content: data.answer });
    } catch (e) {
      removeTyping();
      addMessage('error', 'Não foi possível conectar ao servidor. Tente novamente.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  addMessage('bot', 'Olá! Sou um chatbot com RAG especializado em jogos eletrônicos. Pergunte, por exemplo: "Quando o Nintendo Switch foi lançado?" ou "O que é um MOBA?".');
</script>
</body>
</html>
